name: ROM Builder

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'ROM turu (orn. crDroid)'
        required: true
        default: 'crDroid'
      android_version:
        description: 'Android surumu (orn. 13.0)'
        required: true
        default: '13.0'
      device_codename:
        description: 'Cihaz kod adi (orn. CPH2269)'
        required: true
        default: 'CPH2269'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Test Calisma
        run: echo "Sistem calisiyor! Cihaz: ${{ github.event.inputs.device_codename }}"
