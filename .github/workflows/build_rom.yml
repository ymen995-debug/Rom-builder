name: Build crDroid for Huawei MatePad T10s

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü'
        required: true
        default: 'crdroid'
      android_version:
        description: 'Android Sürümü (örn. 10.0)'
        required: true
        default: '10.0'
      device_brand:
        description: 'Cihaz Markası (örn. huawei)'
        required: true
        default: 'huawei'
      device_codename:
        description: 'Cihaz Kod Adı (örn. agold)'
        required: true
        default: 'agold'
      github_username:
        description: 'GitHub Kullanıcı Adın'
        required: true
        default: 'ymen995-debug'
      github_token:
        description: 'GitHub Personal Access Token (PAT)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Our Local Manifests)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Initialize crDroid Workspace & Clone Trees
        run: |
          mkdir -p /home/runner/rom
          cd /home/runner/rom
          
          repo init -u https://github.com/crdroidandroid/android.github.com -b 13.0 --git-lfs
          mkdir -p .repo/local_manifests
          
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          
          rm -rf device/oplus/CPH2269 vendor/oplus/CPH2269
          git clone https://github.com/ksauraj/A16.git -b 12-CPH2269_11_A.01 device/oplus/CPH2269
          git clone https://github.com/autoandroida/vendor_oplus_CPH2269.git vendor/oplus/CPH2269

      - name: Adapt Device Tree for crDroid
        run: |
          cd /home/runner/rom/device/oplus/CPH2269
          if [ -f lineage_CPH2269.mk ]; then
            mv lineage_CPH2269.mk crdroid_CPH2269.mk
            sed -i 's/lineage_CPH2269/crdroid_CPH2269/g' AndroidProducts.mk crdroid_CPH2269.mk
            sed -i 's|vendor/lineage/config/common_full_phone.mk|vendor/crdroid/config/common_full_phone.mk|g' crdroid_CPH2269.mk
          fi

      - name: Build crDroid for Oppo A16
        run: |
          cd /home/runner/rom
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch crdroid_CPH2269-userdebug
          mka bacon
