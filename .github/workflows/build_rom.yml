name: Build CrDroid for Huawei MatePad T10s

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü'
        required: true
        default: 'crdroid'
      android_version:
        description: 'Android Sürümü'
        required: true
        default: '10'
      device_brand:
        description: 'Cihaz Markası'
        required: true
        default: 'huawei'
      device_codename:
        description: 'Cihaz Kod Adı'
        required: true
        default: 'agold'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl

      - name: Install Google Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize and Sync crDroid Manifest
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom
          cd ~/rom
          export PATH=~/bin:$PATH
          
          # Sadece yetki gerektirmeyen global credential ve url ayarları
          git config --global credential.helper ""
          git config --global url."https://github.com/".insteadOf git://github.com/
          
          echo "Secilen ROM: crdroid"
          
          # Auth prompt'u engelleyen ve repo çeken init
          GIT_TERMINAL_PROMPT=0 repo init -u https://github.com/crdroidandroid/android_manifest.git -b 10.0 --depth=1 --no-repo-verify
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build ROM for Selected Device
        run: |
          cd ~/rom
          export PATH=~/bin:$PATH
          source build/envsetup.sh
          echo "Secilen cihaz kod adina gore lunch komutu"
          echo "Derleme baslatiliyor: ${{ github.event.inputs.device_codename }}"
          lunch lineage_${{ github.event.inputs.device_codename }}-userdebug
          mka bacon -j$(nproc --all)
