name: Build crDroid for Huawei MatePad T10s

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü'
        required: true
        default: 'crdroid'
      android_version:
        description: 'Android Sürümü (örn. 10.0)'
        required: true
        default: '10.0'
      device_brand:
        description: 'Cihaz Markası (örn. huawei)'
        required: true
        default: 'huawei'
      device_codename:
        description: 'Cihaz Kod Adı (örn. agold)'
        required: true
        default: 'agold'
      github_username:
        description: 'GitHub Kullanıcı Adın'
        required: true
        default: 'ymen995-debug'
      github_token:
        description: 'GitHub Personal Access Token (PAT)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Our Local Manifests)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Initialize Base Manifest Locally
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom
          cd ~/rom
          
          git config --global user.name "${{ github.event.inputs.github_username }}"
          git config --global user.email "${{ github.event.inputs.github_username }}@debug.local"
          
          echo "Repo aracı kuruluyor..."
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          # İnternetten şifre istemeyen, tamamen yerel manifest kullanan init komutu
          repo init -u https://github.com/crdroidandroid/android.git -b 10.0 --no-repo-verify --depth=1
          
          echo "Repo sync baslatiliyor..."
          repo sync -c -j1 --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync
         
         - name: Build ROM for Selected Device
           run: |
             source build/envsetup.sh
             export ALLOW_MISSING_DEPENDENCIES=true
             lunch crdroid_agold-userdebug
             mka bacon showcommands=true V=1 || { echo "BUILD FAILED MAN"; exit 1; }
