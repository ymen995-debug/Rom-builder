name: Build crDroid for Huawei MatePad T10s

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü (crdroid, lineage, vb.)'
        required: true
        default: 'crdroid'
      android_version:
        description: 'Android Sürümü (örn. 10.0)'
        required: true
        default: '10.0'
      device_brand:
        description: 'Cihaz Markası (örn. huawei)'
        required: true
        default: 'huawei'
      device_codename:
        description: 'Cihaz Kod Adı (örn. agold)'
        required: true
        default: 'agold'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Clone Manifest Directly & Bypass Auth
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom/.repo
          cd ~/rom
          
          # Auth kilidini ve credential helper'ı global olarak patlatıyoruz
          git config --global credential.helper ""
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global user.name "kral_eymen219"
          git config --global user.email "ymen995@debug.local"
          
          echo "Secilen ROM: ${{ github.event.inputs.rom_type }}"
          echo "Secilen Android: ${{ github.event.inputs.android_version }}"
          echo "Hedef Cihaz: ${{ github.event.inputs.device_codename }}"
          
          # Repo init yerine doğrudan manifesti klonlayıp auth duvarını bypas ediyoruz
          git clone https://github.com/crdroidandroid/android_manifest.git -b ${{ github.event.inputs.android_version }} --depth=1 .repo/manifests
          
          mkdir -p .repo/manifests.git
          ln -s ../manifests/.git .repo/manifests.git/refs
          ln -s manifests/default.xml .repo/manifest.xml
          
          # Google repo aracını indir ve sync et
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          repo sync -c -j1 --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Build ROM for Selected Device
        run: |
          cd ~/rom
          export PATH=~/bin:$PATH
          source build/envsetup.sh
          echo "Derleme baslatiliyor: ${{ github.event.inputs.device_codename }}"
          lunch lineage_${{ github.event.inputs.device_codename }}-userdebug
          mka bacon -j$(nproc --all)
