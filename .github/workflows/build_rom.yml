name: Build crDroid 10 for MatePad T10s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Clone Manifest Directly (Bypass Repo Init Auth)
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom/.repo
          cd ~/rom
          
          # Git kimliklerini global olarak temizle ve sabitle
          git config --global credential.helper ""
          git config --global user.name "kral_eymen219"
          git config --global user.email "ozmuseymen995@gmail.com"
          
          echo "Manifest dorudan klonlaniyor..."
          
          # repo init kullanmadan, doğrudan manifest reposunu klonluyoruz
          git clone https://github.com/crdroidandroid/android_manifest.git -b 10.0 --depth=1 .repo/manifests
          
          # Default manifest bağlantısını ayarlıyoruz
          mkdir -p .repo/manifests.git
          ln -s ../manifests/.git .repo/manifests.git/refs
          ln -s manifests/default.xml .repo/manifest.xml
          
          echo "Manifest baglantisi kuruldu, sync baslatiliyor..."
          repo sync -c -j1 --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Build ROM for Selected Device
        run: |
          cd ~/rom
          export PATH=~/bin:$PATH
          source build/envsetup.sh
          lunch lineage_agold-userdebug
          mka bacon -j$(nproc --all)
