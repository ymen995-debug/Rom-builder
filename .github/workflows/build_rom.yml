name: OS ROM Compiler

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü'
        required: true
        default: ''
      android_version:
        description: 'Android Sürümü (örn. 13.0)'
        required: true
        default: '11.0'
      device_brand:
        description: 'Cihaz Markası (örn. Huawei)'
        required: true
        default: ''
      device_codename:
        description: 'Cihaz Kod Adı (örn. agold)'
        required: true
        default: ''
      github_username:
        description: 'GitHub Kullanıcı Adın'
        required: true
        default: ''
      github_token:
        description: 'GitHub Personal Access Classic Token (PAT)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Our Local Manifests)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Initialize Base Manifest Locally
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom
          cd ~/rom

          git config --global user.name "${{ github.event.inputs.github_username }}"
          git config --global user.email "${{ github.event.inputs.github_username }}@debug.local"

          # Token'ı git credential sistemine kaydederek auth duvarını aşıyoruz
          git config --global credential.helper store
          echo "https://${{ github.event.inputs.github_username }}:${{ github.event.inputs.github_token }}@github.com" > ~/.git-credentials

          echo "Repo aracı kuruluyor..."
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          echo "Repo sync baslatiliyor (crDroid 11)..."
          repo init -u https://github.com/crdroidandroid/android.git -b 11.0 --no-repo-verify --depth=1
          repo sync -c -j1 --no-clone-bundle --no-tags --optimized-fetch --prune --force-syn

      - name: Create Device Tree Directories
        run: |
          cd /home/runner/rom
          mkdir -p device/oppo/CPH2269
          mkdir -p vendor/oplus/CPH2269

      - name: Clone Oppo A16 ROM Device & Vendor Trees
        run: |
          cd /home/runner/rom
          rm -rf device_oppo_CPH2269 vendor_oplus_CPH2269
          git clone https://github.com/secr5t/device_oppo_CPH2269.git device/oppo/CPH2269
          git clone https://github.com/autoandroida/vendor_oplus_CPH2269.git vendor/oplus/CPH2269

      - name: Adapt Device Tree for crDroid
        run: |
          cd /home/runner/rom/device/oppo/CPH2269
          if [ -f "twrp_CPH2269.mk" ]; then
            mv twrp_CPH2269.mk crdroid_CPH2269.mk
          fi
          sed -i 's/twrp_CPH2269/crdroid_CPH2269/g' AndroidProducts.mk || true
          sed -i 's/twrp_CPH2269/crdroid/g' crdroid_CPH2269.mk || true
          sed -i 's|vendor/twrp/config/common.mk|vendor/crdroid/config/common.mk|g' crdroid_CPH2269.mk || true

      - name: Upload ROM to GitHub Repository
        run: |
          git config --global user.name "ymen995-debug"
          git config --global user.email "ozmuseymen995@gmail.com"
    
          # rom-repo klasörünün içine ROM zip dosyasının kopyalandığından emin oluyoruz
          cp out/target/product/cph2269/*.zip rom-repo/ || true
    
          cd /home/runner/rom
          ls -la
          cd /home/runner/rom/rom-repo
          ls -la
          cd
          cd /home/runner/rom
          ls -la
          cd rom-repo
          git add .
          git diff --cached --quiet || git commit -m "Upload crDroid ROM for CPH2269"
          git push origin main --force
