name: Build crDroid for Huawei MatePad T10s

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü (crdroid, lineage, vb.)'
        required: true
        default: 'crdroid'
      android_version:
        description: 'Android Sürümü (örn. 10.0)'
        required: true
        default: '10.0'
      device_brand:
        description: 'Cihaz Markası (örn. huawei)'
        required: true
        default: 'huawei'
      device_codename:
        description: 'Cihaz Kod Adı (örn. agold)'
        required: true
        default: 'agold'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Initialize Base Manifest and Copy Local Manifests
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom
          cd ~/rom
          
          git config --global credential.helper ""
          git config --global user.name "kral_eymen219"
          git config --global user.email "ymen995@debug.local"
          
          echo "Ana LineageOS 17.1 (Android 10) Manifesti Kuruluyor..."
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          # Sağlam Lineage manifestini init et
          repo init -u https://github.com/LineageOS/android_manifest.git -b lineage-17.1 --depth=1 --no-repo-verify
          
          # KRİTİK NOKTA: Kendi depomuzdaki local_manifests dosyalarını .repo altına kopyalıyoruz
          mkdir -p .repo/local_manifests
          cp -r $GITHUB_WORKSPACE/local_manifests/* .repo/local_manifests/
          
          echo "Yerel manifest kopyalandı, içerik:"
          ls -la .repo/local_manifests/
          
          echo "Repo sync baslatiliyor..."
          repo sync -c -j1 --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Build ROM for Selected Device
        run: |
          cd ~/rom
          export PATH=~/bin:$PATH
          source build/envsetup.sh
          echo "Derleme baslatiliyor: ${{ github.event.inputs.device_codename }}"
          lunch lineage_${{ github.event.inputs.device_codename }}-userdebug
          mka bacon -j$(nproc --all)
