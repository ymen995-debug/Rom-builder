name: Build crDroid for Oppo A16

on:
  workflow_dispatch:
    inputs:
      rom_type:
        description: 'Derlenecek ROM Türü'
        required: true
        default: 'crdroid'
      android_version:
        description: 'Android Sürümü (örn. 13.0)'
        required: true
        default: '13.0'
      device_brand:
        description: 'Cihaz Markası (örn. oppo)'
        required: true
        default: 'oppo'
      device_codename:
        description: 'Cihaz Kod Adı (örn. CPH2269)'
        required: true
        default: 'CPH2269'
      github_username:
        description: 'GitHub Kullanıcı Adın'
        required: true
        default: 'ymen995-debug'
      github_token:
        description: 'GitHub Personal Access Token (PAT)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Our Local Manifests)
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl python3

      - name: Initialize Base Manifest Locally
        run: |
          rm -rf ~/rom
          mkdir -p ~/rom
          cd ~/rom

          git config --global user.name "${{ github.event.inputs.github_username }}"
          git config --global user.email "${{ github.event.inputs.github_username }}@debug.local"

          # Token'ı git credential sistemine kaydederek auth duvarını aşıyoruz
          git config --global credential.helper store
          echo "https://${{ github.event.inputs.github_username }}:${{ github.event.inputs.github_token }}@github.com" > ~/.git-credentials

          echo "Repo aracı kuruluyor..."
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

          echo "Repo sync baslatiliyor (crDroid 11)..."
          repo init -u https://github.com/crdroidandroid/android.git -b 11.0 --no-repo-verify --depth=1
          repo sync -c -j1 --no-clone-bundle --no-tags --optimized-fetch --prune --force-syn

      - name: Clone Oppo A16 ROM Device & Vendor Trees
        run: |
          cd ~/rom
          rm -rf device/oplus/CPH2269 vendor/oplus/CPH2269
          git clone https://github.com/secr5t/device_oppo_CPH2269.git
          git clone https://github.com/autoandroida/vendor_oplus_CPH2269.git vendor/oplus/CPH2269

      - name: Adapt Device Tree for crDroid
        run: |
          cd ~/rom/device_oppo_CPH2269
          for f in *.mk; do
            if [[ "$f" != "AndroidProducts.mk" ]]; then
              sed -i 's/lineage/crdroid/g' "$f"
              sed -i 's|vendor/lineage/config/common_full_phone.mk|vendor/crdroid/config/common.mk|g' "$f"
            fi
          done

      - name: Build ROM for Selected Device
        run: |
          set -e
          # Doğrudan repo sync'in dosyaları attığı ana rom klasörüne zıplıyoruz
          cd ~/rom  cd /home/runner/rom  cd rom
          
          pwd
          ls -la
          
          if [ ! -f "build/envsetup.sh" ]; then
            echo "HATA: build/envsetup.sh hala burada yok!"
            exit 1
          fi

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch Lineage_CPH2269-userdebug || lunch crdroid_CPH2269-userdebug
          mka bacon showcommands=true V=1
